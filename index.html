<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomasa misijas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5DA130">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a blocky pixel world drawn on a canvas behind the page; content sits in bevelled stone panels with square corners. One theme by choice. */
:root{
  color-scheme: light;
  --sky:#7DB8F5; --panel:#C6C6C6; --hi:#FFFFFF; --lo:#585858; --ink:#1D1D1D; --soft:#454545;
  --grass:#5DA130; --gold:#F8D548; --aqua:#6FE3DA; --red:#D8423A; --slot:#E4E4E4;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;font-weight:600}
#world{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;font-weight:700}
h1{font-size:38px} h2{font-size:26px} h3{font-size:21px}
p{margin:0}
.muted{color:var(--soft);font-size:17px}
.hero h1{color:#fff;text-shadow:3px 3px 0 #1D1D1D}
.hero .muted{color:#fff;text-shadow:2px 2px 0 #1D1D1D}
.card{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo);padding:20px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:4px solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile.p{background:var(--gold);box-shadow:inset 4px 4px 0 #FFF3A8,inset -4px -4px 0 #B8901C}
.tile.m{background:var(--aqua);box-shadow:inset 4px 4px 0 #D2FBF6,inset -4px -4px 0 #2E9C95}
.tile b{font-family:var(--body);font-size:48px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-weight:700;font-size:17px}
.bar{height:18px;border:4px solid var(--ink);background:#2A2A2A;overflow:hidden}
.bar i{display:block;height:100%;background:#7EE034;box-shadow:inset 0 3px 0 #C4F58A,inset 0 -3px 0 #4C9A16;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);padding:2px 10px;font-weight:700;font-size:16px;background:#fff;font-family:inherit;color:var(--ink)}
.chip.wait{background:#F6E7A1} .chip.ok{background:#B5E08A} .chip.no{background:#F3B1AC}
.task{display:flex;align-items:center;gap:12px;border:4px solid var(--ink);padding:10px 12px;background:var(--slot);box-shadow:inset 3px 3px 0 #9A9A9A,inset -3px -3px 0 #fff;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.task .box{flex:none;width:36px;height:36px;border:4px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.task.done{background:#F6E7A1} .task.done .box{background:var(--gold)}
.task.ok{background:#B5E08A;cursor:default} .task.ok .box{background:var(--grass);color:#fff}
.task .t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.task small{display:block;font-weight:600;color:var(--soft);font-size:16px}
.pts{font-family:var(--body);font-weight:700;font-size:20px;white-space:nowrap}
button{font:inherit;color:inherit}
.btn{border:4px solid var(--ink);background:#7A7A7A;color:#fff;text-shadow:2px 2px 0 #2A2A2A;font-family:var(--body);font-weight:700;font-size:19px;padding:8px 16px;box-shadow:inset 3px 3px 0 #B0B0B0,inset -3px -3px 0 #4A4A4A;cursor:pointer}
.btn:active{box-shadow:inset 3px 3px 0 #4A4A4A,inset -3px -3px 0 #B0B0B0}
.btn.alt{background:#E4E4E4;color:var(--ink);text-shadow:none;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #9A9A9A}
.btn.go{background:var(--grass);box-shadow:inset 3px 3px 0 #8FD45A,inset -3px -3px 0 #37691A}
.btn.warn{background:var(--red);box-shadow:inset 3px 3px 0 #F08A84,inset -3px -3px 0 #8E221C}
.btn.sm{font-size:17px;padding:4px 12px;border-width:3px}
.btn:disabled{background:#B4B4B4;color:#6A6A6A;text-shadow:none;box-shadow:none;cursor:not-allowed}
:focus-visible{outline:4px solid var(--red);outline-offset:2px}
input,select{font:inherit;color:var(--ink);border:4px solid var(--ink);border-radius:0;padding:8px 10px;background:#fff;min-width:0;width:100%}
label{font-weight:700;font-size:17px;display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reward{display:flex;align-items:center;gap:12px;border:4px solid var(--ink);padding:10px 12px;background:var(--slot);box-shadow:inset 3px 3px 0 #9A9A9A,inset -3px -3px 0 #fff;flex-wrap:wrap}
.reward .t{flex:1 1 180px;min-width:0;font-weight:700}
.reward.goal{background:#F6E7A1}
.tier{font-family:var(--body);font-weight:700;font-size:18px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
nav{position:fixed;left:0;right:0;bottom:0;z-index:2;background:var(--panel);border-top:4px solid var(--ink);box-shadow:inset 0 4px 0 var(--hi);display:flex;justify-content:center;gap:6px;padding:10px 12px calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;max-width:170px;text-align:center;text-decoration:none;color:var(--ink);font-family:var(--body);font-weight:700;font-size:17px;border:4px solid transparent;padding:6px 4px}
nav a.on{background:var(--grass);border-color:var(--ink);color:#fff;text-shadow:2px 2px 0 #2A2A2A;box-shadow:inset 3px 3px 0 #8FD45A,inset -3px -3px 0 #37691A}
.note{border:4px solid var(--ink);padding:8px 12px;background:#F6E7A1;font-size:17px;font-weight:700}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#dlg.on{display:flex}
#dlg .card{width:100%;max-width:440px;max-height:90%;overflow:auto}
.hist{display:flex;flex-direction:column;gap:6px;font-size:17px}
.hist div{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #9A9A9A;padding-bottom:4px}
.hist span:last-child{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pop{animation:pop .35s steps(4)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.tile b{font-size:38px}h1{font-size:30px}}
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div id="app"></div>
<nav id="nav"></nav>
<div id="dlg"><div class="card" id="dlgc" role="dialog" aria-modal="true"></div></div>
<script>
"use strict";
/* ---------- Noklusējuma iestatījumi (vecāki var mainīt sadaļā "Vecākiem") ---------- */
const DEF = {
  rate: 5,
  timetable: {
    1: ["Vizuālā māksla","Matemātika","Dizains un tehnoloģijas","Latviešu valoda","Sports un veselība"],
    2: ["Latviešu valoda","Klases stunda","Angļu valoda","Matemātika","Fakultatīvs (matemātika)"],
    3: ["Dabaszinības","Latviešu valoda","Vizuālā māksla","Latviešu valoda","Matemātika"],
    4: ["Latviešu valoda","Angļu valoda","Mūzika","Matemātika","Sports un veselība"],
    5: ["Dabaszinības","Sports un veselība","Latviešu valoda","Sociālās zinības","Mūzika"]
  },
  skip: ["Klases stunda"],
  extras: {"Sports un veselība":"Sporta tērps un apavi"},
  clubs: [
    {id:"baseins", name:"Baseins", days:[2,4,0], bag:"Peldlietas: peldbikses, brilles, dvielis"},
    {id:"lego", name:"Lego", days:[2]},
    {id:"sahs", name:"Šahs", days:[3]},
    {id:"keramika", name:"Keramika", days:[]}
  ],
  /* days: 0 = svētdiena … 6 = sestdiena */
  missions: [
    {id:"logopeds", label:"Logopēda vingrinājumi", p:15, days:[0,1,2,3,4,5,6]},
    {id:"glitraksti", label:"Glītraksti", p:10, days:[0,1,2,3,4,5,6]},
    {id:"macibas", label:"Pašam izmācīties", p:15, days:[1,2,3,4,5]},
    {id:"istaba", label:"Pievākt istabu", p:10, days:[0,1,2,3,4,5,6]},
    {id:"pastaiga", label:"Brīvdienu pastaiga visai ģimenei", p:20, days:[6,0], family:true}
  ],
  bagPts: 5,
  bonus: ["Iznest atkritumus","Izkraut trauku mašīnu","Uzklāt galdu","Novākt galdu","Salocīt savas drēbes","Aplaistīt puķes","Izsūkt savu istabu","Palīdzēt gatavot vakariņas","Sakārtot apavus priekšnamā","Saklāt gultu"],
  rewards: {
    r1:{label:"Papildu 5 minūtes ekrāna", cost:25, tier:1, min:5},
    r2:{label:"Masāža", cost:30, tier:1},
    r3:{label:"Kinder ola", cost:50, tier:1},
    r4:{label:"2 eiro", cost:150, tier:2},
    r5:{label:"Kino vakars", cost:200, tier:2},
    r6:{label:"Pokemon kārtis", cost:250, tier:2},
    r7:{label:"Pārgājiens pēc Tomasa izvēles", cost:250, tier:2},
    r9:{label:"Lielais Lego", cost:1200, tier:3},
    r8:{label:"Nakts viesnīcā", cost:2000, tier:3}
  }
};
const DAY = ["svētdiena","pirmdiena","otrdiena","trešdiena","ceturtdiena","piektdiena","sestdiena"];
const DAYD = ["svētdienai","pirmdienai","otrdienai","trešdienai","ceturtdienai","piektdienai","sestdienai"];
const DSH = ["Sv","P","O","T","C","Pk","S"];
const TIERS = {1:"Mazās balvas",2:"Vidējās balvas",3:"Lielās balvas"};
const LEVELS = ["Koka iesācējs","Koka meistars","Akmens iesācējs","Akmens meistars","Dzelzs iesācējs","Dzelzs meistars","Zelta iesācējs","Zelta meistars","Dimanta iesācējs","Dimanta meistars","Leģenda"];
/* Līmeņa sliekšņi aug: 100, 300, 600, 1000, 1500 … (n. līmenis sākas pie 50·n·(n−1) punktiem) */
const lvStart = n => 50 * n * (n + 1);
function levelOf(e){ let n = 0; while (e >= lvStart(n + 1)) n++; return {n, from: lvStart(n), to: lvStart(n + 1)}; }
const missionsOn = dow => DEF.missions.filter(d => d.days.indexOf(dow) >= 0);

/* ---------- Stāvoklis un glabātuve ---------- */
const S = {days:{}, cfg:{}, kid:{}, mode:"loading"};   // mode: loading | cloud | local | offline | readonly
let db = null, parentOk = false, dirty = false;
const chain = {}, pending = {}, exists = {};
const LS = "tomasa-misijas-v1";
const clone = o => JSON.parse(JSON.stringify(o));
function merge(t, p){ for (const k in p){ const v = p[k]; if (v && typeof v === "object" && !Array.isArray(v)) t[k] = merge(t[k] && typeof t[k] === "object" && !Array.isArray(t[k]) ? Object.assign({}, t[k]) : {}, v); else t[k] = v; } return t; }
function slot(path){ const [c, id] = path.split("/"); if (c === "days") return {get:()=>S.days[id], set:v=>{S.days[id]=v}}; if (c === "config") return {get:()=>S.cfg, set:v=>{S.cfg=v}}; return {get:()=>S.kid, set:v=>{S.kid=v}}; }
function write(path, patch){
  if (S.mode === "loading" || S.mode === "offline" || S.mode === "readonly") return;
  const sl = slot(path); sl.set(merge(Object.assign({}, sl.get() || {}), clone(patch))); render(true);
  if (S.mode === "local"){ saveLocal(); return; }
  pending[path] = (pending[path] || 0) + 1;
  chain[path] = (chain[path] || Promise.resolve()).then(async () => {
    const ref = db.doc(path);
    try {
      if (exists[path]){
        try { await ref.update(clone(patch)); }
        catch (e) { if (!e || e.code !== "invalid_argument") throw e; await ref.set(clone(sl.get() || patch)); }   // dokuments izdzēsts citur: ieraksta visu no jauna
      } else await ref.set(clone(sl.get() || patch));
      exists[path] = true;
    }
    catch (e) { if (e && e.code === "invalid_argument") S.mode = "readonly"; else if (e && e.code === "revoked") S.mode = "offline"; }
    pending[path]--; if (S.mode !== "cloud") render(true);
  });
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify({days:S.days, cfg:S.cfg, kid:S.kid})); S.storeErr = false; } catch(e){ S.storeErr = true; render(true); } }
async function boot(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  route(); render(true);
  let c = null;
  try { c = (window.claude && window.claude.use) ? await window.claude.use("db") : null; } catch(e){ c = null; }
  if (!c){ S.mode = "local"; try { const o = JSON.parse(localStorage.getItem(LS) || "{}"); S.days = o.days || {}; S.cfg = o.cfg || {}; S.kid = o.kid || {}; } catch(e){} render(true); return; }
  db = c; const got = {};
  const timer = setTimeout(() => { if (S.mode === "loading"){ S.mode = "offline"; render(true); } }, 10000);
  const ready = k => { got[k] = 1; if (got.d && got.c && got.k && (S.mode === "loading" || S.mode === "offline")){ clearTimeout(timer); S.mode = "cloud"; } render(); };
  const fail = () => { clearTimeout(timer); S.mode = "offline"; render(true); };
  db.collection("days").onSnapshot(q => { const n = {}; for (const p in exists) if (p.indexOf("days/") === 0) exists[p] = false; q.docs.forEach(d => { const p = "days/" + d.id; exists[p] = true; n[d.id] = pending[p] > 0 && S.days[d.id] ? S.days[d.id] : clone(d.data() || {}); }); for (const id in S.days) if (pending["days/" + id] > 0 && !n[id]) n[id] = S.days[id]; S.days = n; ready("d"); }, fail);
  db.doc("config/main").onSnapshot(s => { exists["config/main"] = s.exists; if (!(pending["config/main"] > 0)) S.cfg = s.exists ? clone(s.data()) : {}; ready("c"); }, fail);
  db.doc("meta/kid").onSnapshot(s => { exists["meta/kid"] = s.exists; if (!(pending["meta/kid"] > 0)) S.kid = s.exists ? clone(s.data()) : {}; ready("k"); }, fail);
}

/* ---------- Palīgfunkcijas ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fromKey = k => { const a = k.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const isSchool = d => d.getDay() >= 1 && d.getDay() <= 5;
const slug = s => "i_" + s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "_");
function bagTarget(now){ if (isSchool(now) && now.getHours() < 9) return now; let d = addDays(now, 1); while (!isSchool(d)) d = addDays(d, 1); return d; }
function clubs(){ const cd = S.cfg.clubDays || {}; return DEF.clubs.map(c => Object.assign({}, c, {days: Array.isArray(cd[c.id]) ? cd[c.id] : c.days})); }
function clubsOn(dow){ return clubs().filter(c => c.days.indexOf(dow) >= 0); }
function bagItems(d){
  const out = [{k:"i_pamats", t:"Penālis un dienasgrāmata"}], seen = {};
  (DEF.timetable[d.getDay()] || []).forEach(l => { if (seen[l] || DEF.skip.indexOf(l) >= 0) return; seen[l] = 1; out.push({k:slug(l), t:l, sub:"mācību grāmata un burtnīca"}); if (DEF.extras[l]) out.push({k:slug(DEF.extras[l]), t:DEF.extras[l], sub:"sporta stundai"}); });
  clubsOn(d.getDay()).forEach(c => { if (c.bag) out.push({k:slug(c.id + "_soma"), t:c.bag, sub:"pulciņam: " + c.name}); });
  return out;
}
function rate(){ return +S.cfg.rate > 0 ? +S.cfg.rate : DEF.rate; }
function rewards(){ const r = merge(clone(DEF.rewards), S.cfg.rewards || {}); return Object.keys(r).map(id => Object.assign({id}, r[id])).filter(x => !x.off && x.label).sort((a, b) => (a.tier - b.tier) || (a.cost - b.cost)); }
function totals(){
  let p = 0, min = 0, earned = 0, pages = 0;
  for (const d of Object.values(S.days)){
    for (const m of Object.values(d.m || {})) if (m && m.s === "ok"){ p += +m.p || 0; earned += +m.p || 0; }
    for (const r of Object.values(d.r || {})) if (r && r.s === "ok"){ min += +r.min || 0; pages += +r.pages || 0; }
    for (const u of Object.values(d.u || {})) if (u && u.s !== "void") min -= +u.min || 0;
    for (const b of Object.values(d.buy || {})) if (b && b.s !== "void"){ p -= +b.cost || 0; min += +b.min || 0; }
    for (const a of Object.values(d.adj || {})) if (a){ p += +a.p || 0; min += +a.min || 0; }
  }
  return {p, min, earned, pages};
}
/* Sērija: diena skaitās, ja izdarītas visas tās dienas paša Tomasa misijas (ģimenes pastaiga sēriju nepārtrauc) */
function dayDone(d){ const m = (S.days[key(d)] || {}).m || {}, ids = missionsOn(d.getDay()).filter(x => !x.family).map(x => x.id).concat(isSchool(d) ? ["soma"] : []);
  return ids.every(id => m[id] && (m[id].s === "done" || m[id].s === "ok")); }
function streak(now){ let n = 0, d = now; if (!dayDone(d)) d = addDays(d, -1); for (let i = 0; i < 366; i++){ if (dayDone(d)) n++; else break; d = addDays(d, -1); } return n; }
function pendingList(){
  const out = [];
  Object.keys(S.days).sort().forEach(k => { const d = S.days[k];
    for (const id in (d.m || {})) if (d.m[id] && d.m[id].s === "done") out.push({k, f:"m", id, t:d.m[id].label, v:"+" + d.m[id].p + " p."});
    for (const id in (d.r || {})) if (d.r[id] && d.r[id].s === "wait") out.push({k, f:"r", id, t:"Lasīšana: " + d.r[id].pages + " lpp." + (d.r[id].book ? " (" + d.r[id].book + ")" : ""), v:"+" + d.r[id].min + " min"});
    for (const id in (d.buy || {})) if (d.buy[id] && d.buy[id].s === "new") out.push({k, f:"buy", id, t:"Balva: " + d.buy[id].label, v:"−" + d.buy[id].cost + " p."});
  });
  return out;
}
function history(){
  const ev = [];
  Object.keys(S.days).forEach(k => { const d = S.days[k];
    for (const m of Object.values(d.m || {})) if (m && m.s === "ok") ev.push([k, m.label, "+" + m.p + " p."]);
    for (const r of Object.values(d.r || {})) if (r && r.s === "ok") ev.push([k, "Lasīšana " + r.pages + " lpp.", "+" + r.min + " min"]);
    for (const u of Object.values(d.u || {})) if (u && u.s !== "void") ev.push([k, "Izmantots ekrāna laiks", "−" + u.min + " min"]);
    for (const b of Object.values(d.buy || {})) if (b && b.s !== "void") ev.push([k, "Balva: " + b.label, "−" + b.cost + " p."]);
    for (const a of Object.values(d.adj || {})) if (a) ev.push([k, a.note || "Vecāku labojums", (a.p ? (a.p > 0 ? "+" : "") + a.p + " p. " : "") + (a.min ? (a.min > 0 ? "+" : "") + a.min + " min" : "")]);
  });
  return ev.sort((a, b) => a[0] < b[0] ? 1 : -1).slice(0, 20);
}
const fmtK = k => { const d = fromKey(k); return d.getDate() + "." + (d.getMonth() + 1) + "."; };

/* ---------- Skati ---------- */
let view = "sodien";
function route(){ const h = (location.hash || "").replace("#", ""); view = ["sodien","lasisana","veikals","vecaki"].indexOf(h) >= 0 ? h : "sodien"; }
function statusNote(){
  if (S.mode === "loading") return '<div class="note">Ielādē saglabātos datus…</div>';
  if (S.mode === "local") return S.storeErr ? '<div class="note">Šajā pārlūkā datus nevar saglabāt. Atver lietotni parastā Chrome logā, ne inkognito režīmā.</div>' : "";
  if (S.mode === "offline") return '<div class="note">Datus pašlaik nevar sasniegt, tāpēc izmaiņas netiek saglabātas. Pārbaudi internetu un atver lapu vēlreiz.</div>';

  if (a === "cfsave"){ const rw = {}; document.querySelectorAll("[data-rw]").forEach(i => { const c = Math.round(+i.value); if (c > 0) rw[i.dataset.rw] = {cost:c}; }); const r = Math.round(+val("cf-rate")); return write("config/main", {rate: r > 0 ? r : rate(), rewards: rw}); }
  if (a === "rwoff"){ const o = {}; o[ds.id] = {off:true}; return write("config/main", {rewards:o}); }
  if (a === "rwadd"){ const l = val("nr-label"), c = Math.round(+val("nr-cost")); if (!l || !(c > 0)) return; const o = {}; o["c_" + uid()] = {label:l, cost:c, tier:+val("nr-tier") || 1}; return write("config/main", {rewards:o}); }
}

/* ---------- Fona pasaule: kluču ainava uz canvas ---------- */
function paintWorld(){
  const c = document.getElementById("world"); if (!c || !c.getContext) return;
  const px = 8, W = Math.max(40, Math.ceil(window.innerWidth / px)), H = Math.max(40, Math.ceil(window.innerHeight / px));
  c.width = W; c.height = H; const g = c.getContext("2d");
  const rnd = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
  for (let y = 0; y < H; y += 4){ const t = y / H; g.fillStyle = "rgb(" + Math.round(104 + 80 * t) + "," + Math.round(170 + 55 * t) + ",250)"; g.fillRect(0, y, W, 4); }
  g.fillStyle = "#FFF6B8"; g.fillRect(W - 24, 5, 14, 14); g.fillStyle = "#FFE14D"; g.fillRect(W - 22, 7, 10, 10);
  g.fillStyle = "rgba(255,255,255,.92)";
  [[.06,.12,18],[.42,.2,26],[.72,.34,16],[.18,.42,22],[.6,.52,14]].forEach(k => { const x = Math.round(k[0] * W), y = Math.round(k[1] * H), w = k[2]; g.fillRect(x, y, w, 3); g.fillRect(x + 3, y - 2, w - 8, 2); g.fillRect(x + 2, y + 3, w - 5, 1); });
  const B = 8, cols = Math.ceil(W / B) + 1, tops = [];
  const GR = ["#5DA130","#6BB53A","#4F8E27"], DI = ["#8A5A33","#7A4E2B","#9A6A3F"], ST = ["#8A8A8A","#7C7C7C","#969696"];
  for (let col = 0; col < cols; col++){
    const hb = 2 + Math.round(1.1 * Math.sin(col * 0.9) + 0.7 * Math.sin(col * 2.3 + 1)), top = H - Math.max(1, hb) * B; tops.push(top);
    for (let x = col * B; x < (col + 1) * B && x < W; x++) for (let y = top; y < H; y++){
      const d = y - top, r = rnd(x, y), pal = (d < 2 || (d === 2 && r > .5)) ? GR : d > 2 * B ? ST : DI;
      g.fillStyle = pal[Math.floor(rnd(x + 3, y + 7) * 3)]; g.fillRect(x, y, 1, 1);
    }
  }
  for (let col = 1; col < cols - 1; col++){
    if (rnd(col, 7) < .7 || rnd(col - 1, 7) >= .7) continue;
    const cx = col * B + 3, top = tops[col];
    g.fillStyle = "#6B4423"; g.fillRect(cx, top - 7, 2, 7);
    for (let x = cx - 4; x < cx + 6; x++) for (let y = top - 14; y < top - 6; y++){ if ((x === cx - 4 || x === cx + 5) && (y === top - 14 || y === top - 7)) continue; g.fillStyle = ["#3F7A1E","#4C8F26","#35691A"][Math.floor(rnd(x, y) * 3)]; g.fillRect(x, y, 1, 1); }
  }
}
let wt = 0; window.addEventListener("resize", () => { clearTimeout(wt); wt = setTimeout(paintWorld, 200); });
